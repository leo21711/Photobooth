<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wedding Virtual Photobooth</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f5f0;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .booth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 500px;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .preview-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video {
      position: absolute;
      top: 23%;
      left: 24.5%;
      width: 51%;
      height: 54%;
      object-fit: cover;
      z-index: 1;
    }
    .frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      object-fit: contain;
    }
    canvas { display: none; }
    .input-group { margin: 16px 0 8px 0; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .btn {
      background: #5b7065;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background 0.2s ease;
    }
    .btn:disabled { background: #bbb; cursor: not-allowed; }
    #status { margin-top: 12px; font-weight: 500; font-size: 14px; }
  </style>
</head>
<body>

<div class="booth-card">
  <h2>📸 Snap a Story Photo</h2>
  
  <div class="preview-container">
    <video id="webcam" autoplay playsinline></video>
    <img id="overlayImg" class="frame-overlay" src="https://github.com/leo21711/Photobooth/blob/main/b6fd25a3-9961-4d83-a0e5-309952d50c94.png" crossorigin="anonymous" alt="Wedding Frame"/>
  </div>

  <canvas id="canvas"></canvas>

  <div class="input-group">
    <input type="text" id="guestName" placeholder="Your Name(s) (Optional)" />
  </div>

  <button class="btn" id="snapBtn">Take & Save Photo</button>
  <div id="status"></div>
</div>

<script>
  // Paste your deployed Google Apps Script Web App URL here
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0TWYeuoLnPikDrvXxQ8jLHB0fpkzy8levtky-2GC_VQDJdsnMbRFACOMfNNPmbQQiMg/exec";

  const video = document.getElementById('webcam');
  const overlayImg = document.getElementById('overlayImg');
  const canvas = document.getElementById('canvas');
  const snapBtn = document.getElementById('snapBtn');
  const statusDiv = document.getElementById('status');

  async function initCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } }, 
        audio: false 
      });
      video.srcObject = stream;
    } catch (err) {
      statusDiv.style.color = "red";
      statusDiv.innerText = "Please allow camera access to take a photo.";
    }
  }

  snapBtn.addEventListener('click', async () => {
    snapBtn.disabled = true;
    statusDiv.style.color = "#333";
    statusDiv.innerText = "Capturing photo...";

    const outWidth = 1920;
    const outHeight = 1080;
    canvas.width = outWidth;
    canvas.height = outHeight;

    const ctx = canvas.getContext('2d');

    // 1. Draw template background
    ctx.drawImage(overlayImg, 0, 0, outWidth, outHeight);

    // 2. Calculate dimensions for inner window cutout
    const cutoutX = outWidth * 0.245;
    const cutoutY = outHeight * 0.23;
    const cutoutW = outWidth * 0.51;
    const cutoutH = outHeight * 0.54;

    // 3. Draw live video feed into cutout area
    ctx.drawImage(video, cutoutX, cutoutY, cutoutW, cutoutH);

    // 4. Redraw template frame over the video to give clean crisp edges
    ctx.drawImage(overlayImg, 0, 0, outWidth, outHeight);

    const imageData = canvas.toDataURL('image/jpeg', 0.9);
    const guestName = document.getElementById('guestName').value || "Guest";

    statusDiv.innerText = "Saving directly to Google Drive...";

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ image: imageData, name: guestName })
      });

      const result = await response.json();
      if (result.status === "success") {
        statusDiv.style.color = "green";
        statusDiv.innerText = "🎉 Saved! Your photo is stored in Google Drive.";
      } else {
        throw new Error(result.message);
      }
    } catch (err) {
      statusDiv.style.color = "red";
      statusDiv.innerText = "Upload failed. Please try again.";
    } finally {
      snapBtn.disabled = false;
    }
  });

  window.addEventListener('load', initCamera);
</script>

</body>
</html>
